<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Einstein avatar options</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #F6F3EE;
      color: #0B0B0F;
    }
    main { max-width: 1180px; margin: 0 auto; padding: 28px 20px 48px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p { margin: 0 0 22px; color: #6B7280; }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }
    figure { margin: 0; }
    img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 22px;
      display: block;
      background: white;
      border: 1px solid #E6E8EC;
    }
    figcaption { margin-top: 10px; font-weight: 700; font-size: 14px; }
    figcaption span { display: block; font-weight: 500; color: #6B7280; margin-top: 2px; }
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <main>
    <h1>Five faces</h1>
    <p>Pick a number. This is only the avatar.</p>
    <div class="grid">
      <figure>
        <img src="/einstein-icons/1-pixel.jpg" alt="Pixel Einstein on an orange background" />
        <figcaption>1. Pixel<span>Orange, teal sweater</span></figcaption>
      </figure>
      <figure>
        <img src="/einstein-icons/2-sticker.jpg" alt="Sticker Einstein in a mint circle" />
        <figcaption>2. Sticker<span>Mint circle, coral sweater</span></figcaption>
      </figure>
      <figure>
        <img src="/einstein-icons/3-toy.jpg" alt="Vinyl toy Einstein with glasses" />
        <figcaption>3. Vinyl toy<span>Glasses, lilac coat</span></figcaption>
      </figure>
      <figure>
        <img src="/einstein-icons/4-pop.jpg" alt="Pop art Einstein" />
        <figcaption>4. Pop<span>Pink, yellow, and teal</span></figcaption>
      </figure>
      <figure>
        <img src="/einstein-icons/5-portrait.jpg" alt="Painted Einstein with an atom pin" />
        <figcaption>5. Painted<span>Cream sweater, atom pin</span></figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
