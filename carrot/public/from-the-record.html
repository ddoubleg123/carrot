<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>From the saved transcripts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,560&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #E7E2DA; color: #1C1917; }
    .app { display: flex; min-height: 100vh; }
    .nav {
      width: 72px; flex: none; position: sticky; top: 0; height: 100vh;
      background: #FAFAF8; border-right: 1px solid #E7E5E4;
      display: flex; justify-content: center; padding: 16px 0;
    }
    .logo { width: 36px; height: 36px; border-radius: 12px; background: #FF6A00; color: white; display: grid; place-items: center; font-weight: 800; }
    .stage { flex: 1; padding: 32px 36px 80px; }
    .feed { width: min(980px, 100%); margin: 0 auto; }
    .note { margin: 0 0 22px; max-width: 44rem; font-size: 16px; line-height: 1.5; }
    .note span, .why { color: #57534E; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 22px; align-items: start; }
    .opt { margin: 0; min-width: 0; }
    .label { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .label b { color: #FF6A00; margin-right: 6px; }
    .why { margin: 4px 0 10px; font-size: 13px; line-height: 1.4; min-height: 2.8em; }
    .card { width: 100%; aspect-ratio: 4 / 5; border-radius: 18px; overflow: hidden; position: relative; background: #111; }
    .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .card h2, .card p { margin: 0; }
    .serif { font-family: Newsreader, Georgia, serif; }
    .meta { margin-top: 10px; font-size: 11px; font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase; }
    .band { position: absolute; left: 0; right: 0; bottom: 0; }

    .floor img { object-position: center 16%; }
    .floor .band { background: #7F1D1D; color: #FFF7ED; padding: 14px 16px 14px; }
    .floor h2 { font-weight: 560; font-size: 20px; line-height: 1.18; }

    .lake img { object-position: center 45%; }
    .lake .band { background: #9A3412; color: #FFF7ED; padding: 16px; }
    .lake h2 { font-weight: 650; font-size: 26px; line-height: 1.08; letter-spacing: -0.03em; }

    .vial img { object-position: center 30%; }
    .vial .band { background: #1E3A8A; color: white; padding: 16px; }
    .vial h2 { font-weight: 650; font-size: 22px; line-height: 1.16; letter-spacing: -0.02em; }

    .fire img { object-position: center 18%; }
    .fire .band { background: #92400E; color: #FFFBEB; padding: 14px 16px; }
    .fire h2 { font-weight: 560; font-size: 20px; line-height: 1.16; }

    .cop img { object-position: center 22%; }
    .cop .band { background: #F8FAFC; color: #14532D; padding: 14px 16px 14px; }
    .cop h2 { font-weight: 750; font-size: 22px; line-height: 1.12; letter-spacing: -0.03em; }
    .cop .meta { opacity: 0.75; }

    .hearing img { object-position: center 18%; }
    .hearing .band { background: #3B0764; color: #FAF5FF; padding: 16px; }
    .hearing h2 { font-weight: 650; font-size: 24px; line-height: 1.12; letter-spacing: -0.02em; }

    @media (max-width: 860px) {
      .nav { display: none; }
      .stage { padding: 18px 16px 64px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="nav" aria-hidden="true"><div class="logo">c</div></aside>
    <div class="stage">
      <main class="feed">
        <p class="note">Rebuilt from the quote outward. <span>Each line names its own subject. The picture is that subject, or the person saying it.</span></p>
        <div class="grid">
          <figure class="opt">
            <p class="label"><b>1</b> House floor</p>
            <p class="why">Two whole sentences. The second one names the oncologist, so the pills are cancer medicine. He is saying them at 3:44 and 3:50.</p>
            <article class="card floor">
              <img src="/quote-stills/frame-343.jpg" alt="Mark DeSaulnier speaking on the House floor" />
              <div class="band">
                <h2 class="serif">In my pocket I have pills that were largely developed by American taxpayers that have kept me alive for 10 years. And when I was diagnosed, the house physician, Dr. Moynihan, who's an oncologist, told me, you're lucky.</h2>
                <p class="meta">Mark DeSaulnier<br>House floor · November 18, 2026</p>
              </div>
            </article>
          </figure>

          <figure class="opt">
            <p class="label"><b>2</b> The lake</p>
            <p class="why">The sentence names the lake and how big it is. The frame at 2:57 is that lake. The caption wrote “8 km.”</p>
            <article class="card lake">
              <img src="/quote-stills/baray.jpg" alt="The West Baray, a large man-made lake with a square island" />
              <div class="band">
                <h2>The West Baray alone is a man-made lake that stretches for nearly 8 kilometers.</h2>
                <p class="meta">The narration · 2:55</p>
              </div>
            </article>
          </figure>

          <figure class="opt">
            <p class="label"><b>3</b> Measles</p>
            <p class="why">The disease, the country, and the 26 years are in the first sentence. The second sentence is the scale. The picture is the vaccine in the same report.</p>
            <article class="card vial">
              <img src="/quote-stills/m-025.jpg" alt="A gloved hand holding a vaccine vial" />
              <div class="band">
                <h2>For the first time in 26 years, the US has lost its measles-free status. It's currently going through the largest outbreak in over three decades.</h2>
                <p class="meta">The report · November 17, 2026</p>
              </div>
            </article>
          </figure>

          <figure class="opt">
            <p class="label"><b>4</b> Two wars</p>
            <p class="why">The sentence holds the grandmother, both wars, and what happened to her parents. A spoken “um” was left out. He is saying it.</p>
            <article class="card fire">
              <img src="/quote-stills/dawson.jpg" alt="Paul Dawson speaking" />
              <div class="band">
                <h2 class="serif">I was brought up by my grandmother who'd lived through two wars and nearly starved in the First World War when her mother died and her father was away fighting.</h2>
                <p class="meta">Paul Dawson<br>Retired fire safety officer</p>
              </div>
            </article>
          </figure>

          <figure class="opt">
            <p class="label"><b>5</b> 1.5 degrees</p>
            <p class="why">The world, the 1.5 degrees, and the Paris Agreement are in the claim. She led in by saying the science at this COP is that. The caption wrote “1.5 C.”</p>
            <article class="card cop">
              <img src="/quote-stills/cop15.jpg" alt="Rachel Cleetus speaking in Antalya" />
              <div class="band">
                <h2>The world now inevitably is going to breach 1.5°C of global warming, that treasured guard rail that we had secured in the Paris Agreement.</h2>
                <p class="meta">Rachel Cleetus<br>Union of Concerned Scientists · Antalya</p>
              </div>
            </article>
          </figure>

          <figure class="opt">
            <p class="label"><b>6</b> The hearing</p>
            <p class="why">This sentence names artificial intelligence, the jobs it makes, and the jobs it removes. He is answering at 3:28. November 20, 2026 is on the broadcast.</p>
            <article class="card hearing">
              <img src="/quote-stills/aijobs.jpg" alt="Mr. Gallagher speaking at a House hearing" />
              <div class="band">
                <h2>AI will create jobs more rapidly and it will displace jobs more rapidly than the prior ones.</h2>
                <p class="meta">Mr. Gallagher<br>House hearing · November 20, 2026</p>
              </div>
            </article>
          </figure>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
