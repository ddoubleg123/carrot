<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Five looks for each quote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,560;1,6..72,560&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #E7E2DA; color: #1C1917; }
    .app { display: flex; min-height: 100vh; }
    .nav {
      width: 72px; flex: none; position: sticky; top: 0; height: 100vh;
      background: #FAFAF8; border-right: 1px solid #E7E5E4;
      display: flex; justify-content: center; padding: 16px 0;
    }
    .logo { width: 36px; height: 36px; border-radius: 12px; background: #FF6A00; color: white; display: grid; place-items: center; font-weight: 800; }
    .stage { flex: 1; padding: 28px 28px 72px; min-width: 0; }
    .note { margin: 0 0 28px; max-width: 40rem; font-size: 16px; line-height: 1.5; }
    .note span { color: #57534E; }
    .group { margin: 0 0 34px; }
    .group h2 { margin: 0; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; }
    .group h2 b { color: #FF6A00; margin-right: 6px; }
    .row { display: flex; gap: 14px; overflow-x: auto; padding: 12px 2px 8px; }
    .opt { flex: 0 0 300px; margin: 0; }
    .tag { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #78716C; }
    .card { width: 100%; aspect-ratio: 4 / 5; border-radius: 16px; overflow: hidden; position: relative; background: #111; }
    .card h3, .card p { margin: 0; }
    .card h3 { font-weight: 700; }
    .serif { font-family: Newsreader, Georgia, serif; }
    .meta { margin-top: 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .bleed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .clip { height: 148% !important; top: 0 !important; object-position: center top; }
    .face, .shot { position: relative; overflow: hidden; min-width: 0; min-height: 0; }
    .face img, .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

    .band .copy { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 14px 12px; }
    .band h3 { font-size: 18px; line-height: 1.16; letter-spacing: -0.02em; }
    .crimson { background: #7F1D1D; color: #FFF7ED; }
    .teal { background: #134E4A; color: #F0FDFA; }
    .blue { background: #1E3A8A; color: white; }
    .amber { background: #B45309; color: #FFFBEB; }
    .paper { background: #F8FAFC; color: #14532D; }
    .violet { background: #3B0764; color: #FAF5FF; }

    .field { display: flex; flex-direction: column; padding: 14px; }
    .field h3 { font-size: 20px; line-height: 1.12; letter-spacing: -0.03em; }
    .field .copy { margin-top: auto; }
    .shot.sq { width: 42%; aspect-ratio: 1; border-radius: 12px; align-self: flex-end; }
    .shot.wide { width: 100%; height: 38%; border-radius: 12px; flex: none; }
    .shot.round { width: 46%; aspect-ratio: 1; border-radius: 50%; align-self: flex-start; }
    .shot.tall { width: 38%; height: 46%; border-radius: 14px; align-self: flex-start; }
    .cream { background: #F4EFE6; color: #1C1917; }
    .navy { background: #0F172A; color: #F8FAFC; }
    .white { background: #FAFAF9; color: #1C1917; }
    .ink { background: #18181B; color: #FAFAF9; }
    .green { background: #14532D; color: #F0FDF4; }

    .split { display: grid; grid-template-columns: 46% 1fr; }
    .split.flip { grid-template-columns: 1fr 46%; }
    .split .copy { padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; }
    .split h3 { font-size: 15px; line-height: 1.2; letter-spacing: -0.02em; }
    .indigo { background: #312E81; color: #EEF2FF; }
    .sand { background: #E7D3A1; color: #1C1917; }
    .rose { background: #9F1239; color: #FFF1F2; }
    .forest { background: #14532D; color: #ECFCCB; }
    .char { background: #1C1917; color: #FAFAF9; }
    .butter { background: #FEF3C7; color: #1C1917; }

    .stack { display: flex; flex-direction: column; }
    .stack .copy { flex: 0 0 52%; padding: 12px 12px 10px; display: flex; flex-direction: column; justify-content: space-between; }
    .stack .face { flex: 1; }
    .stack h3 { font-size: 15px; line-height: 1.18; letter-spacing: -0.02em; }
    .stack.short .copy { flex-basis: 42%; }
    .stack.short h3 { font-size: 22px; line-height: 1.08; }
    .black { background: #111827; color: white; }
    .burn { background: #C2410C; color: #FFF7ED; }
    .ice { background: #E0F2FE; color: #0C4A6E; }
    .wine { background: #881337; color: #FFF1F2; }
    .plum { background: #9D174D; color: #FFF1F2; }

    .float .box { position: absolute; padding: 12px; border-radius: 12px; }
    .float h3 { font-size: 16px; line-height: 1.16; letter-spacing: -0.02em; }
    .float.bottom .box { left: 10px; right: 10px; bottom: 10px; }
    .float.top .box { left: 10px; top: 10px; width: 62%; }
    .float.side .box { right: 10px; bottom: 10px; width: 58%; }
    .float.left .box { left: 10px; bottom: 10px; width: 64%; }
    .float.slim .box { width: 48%; }
    .gold { background: #FDE68A; color: #1C1917; }
    .yellow { background: #FACC15; color: #1C1917; }
    @media (max-width: 860px) { .nav { display: none; } .stage { padding: 16px 14px 48px; } }
  </style>
</head>
